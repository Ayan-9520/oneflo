client_max_body_size 20m;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;

location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

location ~ ^/(api|sanctum|up)(/|$) {
    include fastcgi_params;
    fastcgi_pass app:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_param HTTP_HOST $host;
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 120s;
}

location ~ ^/careers/jobs/[A-Za-z0-9-]+$ {
    if ($http_user_agent ~* "(facebookexternalhit|LinkedInBot|WhatsApp|Twitterbot|Slackbot|TelegramBot|Discordbot|Googlebot)") {
        rewrite ^ /__careers_meta$uri last;
    }
    root /usr/share/nginx/html;
    try_files /index.html =404;
}

location ~ ^/__careers_meta(/careers/jobs/[A-Za-z0-9-]+)$ {
    internal;
    include fastcgi_params;
    fastcgi_pass app:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_param REQUEST_URI $1;
    fastcgi_param HTTP_HOST $host;
    fastcgi_param HTTPS on;
    fastcgi_hide_header X-Powered-By;
}

location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
}
