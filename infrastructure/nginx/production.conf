server {
    listen 80 default_server;
    server_name _;

    location = /api/v1/health {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_HOST 127.0.0.1;
        fastcgi_param HTTPS off;
        fastcgi_hide_header X-Powered-By;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/app.oneflo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.oneflo.in/privkey.pem;
    return 444;
}

server {
    listen 80;
    server_name oneflo.in www.oneflo.in app.oneflo.in api.oneflo.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name oneflo.in www.oneflo.in;
    ssl_certificate /etc/letsencrypt/live/app.oneflo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.oneflo.in/privkey.pem;
    return 301 https://app.oneflo.in$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.oneflo.in api.oneflo.in;
    ssl_certificate /etc/letsencrypt/live/app.oneflo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.oneflo.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/oneflo-app.conf;
}

include /etc/nginx/conf.d/custom/*.conf;
